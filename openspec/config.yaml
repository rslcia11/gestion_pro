# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Flutter/Dart (SDK ^3.6.0), Riverpod state mgmt, self-hosted Supabase (AWS EC2).
  Architecture: feature-based (lib/core, lib/features/{admin,auth,business,cards,help,profile,scanner}, lib/shared).
  Roles: client, business-owner, admin (loyalty/rewards app "Donde Siempre").
  Testing: flutter_test (unit/widget only, no integration_test/golden/patrol).
  Style: flutter_lints ^5.0.0 via analysis_options.yaml, dart format built-in.
  CI: .github/workflows/ci-cd.yml runs flutter analyze (non-fatal warnings/infos) + flutter test + flutter build apk.

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: true
    test_command: "flutter test"
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
    test_command: "flutter test"
    build_command: "flutter build apk --release"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd_mode: true
  detected: 2026-07-29
  test_runner:
    command: "flutter test"
    framework: flutter_test (built-in)
  test_layers:
    unit:
      available: true
      tool: flutter_test
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: "flutter test --coverage"
  quality_tools:
    linter:
      available: true
      command: "flutter analyze"
      tool: flutter_lints ^5.0.0 (analysis_options.yaml)
    type_checker:
      available: true
      command: "flutter analyze"
      tool: Dart static analysis (built-in, same invocation as linter)
    formatter:
      available: true
      command: "dart format ."
